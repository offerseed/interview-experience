:root {
  --bg: #fafafa;
  --bg-warm: #f5f3ef;
  --card: #ffffff;
  --border: #ececec;
  --text: #1d1d1f;
  --text-sub: #86868b;
  --text-mute: #aeaeb2;
  --accent: #6366f1;
  --radius: 16px;
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.10);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

.header {
  padding: 56px 24px 40px;
  text-align: center;
}
.brand {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 16px;
  color: var(--text);
}
.header h1 {
  font-size: 2.6rem; font-weight: 800;
  letter-spacing: -0.03em; margin-bottom: 12px;
  background: linear-gradient(135deg, #1d1d1f 0%, #6366f1 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.tagline { font-size: 1.05rem; color: var(--text-sub); max-width: 520px; margin: 0 auto 28px; }
.search-wrap { max-width: 440px; margin: 0 auto; position: relative; }
.search-wrap input {
  width: 100%; padding: 13px 18px 13px 46px;
  border: 1.5px solid var(--border); border-radius: 14px;
  font-size: 0.95rem; background: var(--card); color: var(--text);
  outline: none; transition: border-color 0.2s, box-shadow 0.2s; font-family: inherit;
}
.search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(99,102,241,0.08); }
.search-wrap input::placeholder { color: var(--text-mute); }
.search-icon {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; stroke: var(--text-mute); fill: none; stroke-width: 2;
}
.stats-row { display: flex; justify-content: center; gap: 40px; margin-top: 28px; }
.stat-item { text-align: center; }
.stat-num { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
.stat-label { font-size: 0.78rem; color: var(--text-mute); margin-top: 2px; }

.main { max-width: 920px; margin: 0 auto; padding: 0 20px 80px; }

.filter-section { margin-bottom: 28px; }
.filter-row {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 12px 0;
}
.filter-row + .filter-row { border-top: 1px solid var(--border); }
.filter-label {
  font-size: 1.2rem; font-weight: 700; color: var(--text);
  margin-right: 12px; flex-shrink: 0;
}
.filter-btn {
  padding: 10px 18px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--card); color: var(--text-sub);
  font-size: 0.95rem; font-weight: 500; cursor: pointer;
  transition: all 0.15s ease; font-family: inherit;
}
.filter-btn:hover { border-color: #d1d1d6; color: var(--text); }
.filter-btn.active { background: var(--text); color: white; border-color: var(--text); }
.filter-btn.no-content { opacity: 0.45; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px;
  text-decoration: none; color: inherit;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; flex-direction: column; gap: 14px;
  position: relative; overflow: hidden;
}
.card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--card-accent, var(--accent)); opacity: 0; transition: opacity 0.25s;
}
.card:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); border-color: transparent; }
.card:hover::before { opacity: 1; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-company { font-size: 0.78rem; color: var(--text-sub); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.card-badge { font-size: 0.68rem; padding: 3px 10px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
.card-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.4; }
.card-info { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--text-sub); margin-top: auto; }
.card-arrow {
  position: absolute; bottom: 20px; right: 20px;
  width: 28px; height: 28px; border-radius: 50%; background: var(--bg-warm);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.25s;
}
.card:hover .card-arrow { opacity: 1; }
.card-arrow svg { width: 14px; height: 14px; stroke: var(--text-sub); fill: none; stroke-width: 2; }

.b-后端 { background: #eef2ff; color: #4f46e5; --card-accent: #4f46e5; }
.b-前端 { background: #ccfbf1; color: #0d9488; --card-accent: #0d9488; }
.b-算法 { background: #f3e8ff; color: #7c3aed; --card-accent: #7c3aed; }
.b-Agent { background: #dcfce7; color: #16a34a; --card-accent: #16a34a; }
.b-Infra { background: #fed7aa; color: #ea580c; --card-accent: #ea580c; }
.b-数据 { background: #fce7f3; color: #db2777; --card-accent: #db2777; }
.b-架构 { background: #f1f5f9; color: #64748b; --card-accent: #64748b; }
.b-安全 { background: #fee2e2; color: #dc2626; --card-accent: #dc2626; }

.empty-state { text-align: center; padding: 80px 20px; color: var(--text-mute); }
.footer { text-align: center; padding: 40px 20px; border-top: 1px solid var(--border); margin-top: 40px; }
.footer p { font-size: 0.82rem; color: var(--text-mute); margin-bottom: 4px; }
.footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
.star-cta {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 10px !important; font-size: 0.85rem !important;
  color: var(--text-sub) !important;
}
.star-cta .star { font-size: 1rem; }

@media (max-width: 640px) {
  .brand { font-size: 1.3rem; }
  .header h1 { font-size: 1.8rem; }
  .header { padding: 40px 20px 28px; }
  .stats-row { gap: 24px; }
  .grid { grid-template-columns: 1fr; }
  .filter-label { width: 100%; margin-bottom: 4px; }
}

let currentCompanyType = "all";
let currentCompany = "all";
let currentFilter = "all";
let searchTerm = "";

// Company groups (categorized)
const companyGroups = {
  "AI公司": ["MiniMax", "智谱AI", "月之暗面", "爱诗科技", "阶跃星辰", "零一万物", "面壁智能"],
  "AI初创": [],
  "互联网大厂": ["B站", "京东", "字节跳动", "小红书", "快手", "拼多多", "携程", "滴滴出行", "百度", "米哈游", "网易", "美团", "腾讯", "阿里巴巴"],
  "自动驾驶": ["小马智行", "小鹏汽车", "文远知行", "理想汽车", "蔚来", "Momenta"],
  "芯片/硬件": ["AMD", "NVIDIA", "华为", "大疆"],
  "具身初创": []
};

// Flatten for lookup
const companyToType = {};
Object.entries(companyGroups).forEach(([type, companies]) => {
  companies.forEach(c => { companyToType[c] = type; });
});

// Build company filter buttons based on selected type
function buildCompanyFilters() {
  const container = document.getElementById("company-filters");
  let companies;
  if (currentCompanyType === "all") {
    companies = Object.values(companyGroups).flat();
  } else {
    companies = companyGroups[currentCompanyType] || [];
  }
  let html = '<span class="filter-label">公司</span>';
  html += '<button class="filter-btn active" data-company="all">全部</button>';
  companies.forEach(c => {
    const hasContent = interviews.some(i => i.company === c);
    html += `<button class="filter-btn${hasContent ? '' : ' no-content'}" data-company="${c}">${c}</button>`;
  });
  container.innerHTML = html;
  // Reset company selection when type changes
  currentCompany = "all";
}

function render() {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  let filtered = interviews.filter(item => {
    const typeMatch = currentCompanyType === "all" || companyToType[item.company] === currentCompanyType;
    const companyMatch = currentCompany === "all" || item.company === currentCompany;
    const catMatch = currentFilter === "all" || item.category === currentFilter;
    const s = searchTerm;
    const searchMatch = !s ||
      item.company.toLowerCase().includes(s) ||
      item.title.toLowerCase().includes(s) ||
      item.position.toLowerCase().includes(s) ||
      item.categoryLabel.toLowerCase().includes(s);
    return typeMatch && companyMatch && catMatch && searchMatch;
  });
  // Sort by date descending (newest first)
  filtered.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  document.getElementById("stat-total").textContent = filtered.length;
  document.getElementById("stat-companies").textContent = new Set(filtered.map(i => i.company)).size;
  if (filtered.length === 0) { grid.innerHTML = ""; empty.style.display = "block"; return; }
  empty.style.display = "none";
  grid.innerHTML = filtered.map(item => `
    <a class="card" href="${item.url}" target="_blank">
      <div class="card-top">
        <span class="card-company">${item.company}</span>
        <span class="card-badge ${item.badgeClass}">${item.categoryLabel}</span>
      </div>
      <div class="card-title">${item.title}</div>
      <div class="card-info">
        <span>${item.position}</span>
        <span>${item.rounds}</span>
        <span>${item.date}</span>
        <span>${item.result}</span>
      </div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </div>
    </a>
  `).join("");
}

// Company type filter clicks
document.getElementById("company-type-filters").addEventListener("click", e => {
  if (e.target.classList.contains("filter-btn")) {
    document.querySelectorAll("#company-type-filters .filter-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentCompanyType = e.target.dataset.ctype;
    buildCompanyFilters();
    render();
  }
});

// Company filter clicks
document.getElementById("company-filters").addEventListener("click", e => {
  if (e.target.classList.contains("filter-btn")) {
    document.querySelectorAll("#company-filters .filter-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentCompany = e.target.dataset.company;
    render();
  }
});

// Direction filter clicks
document.getElementById("filters").addEventListener("click", e => {
  if (e.target.classList.contains("filter-btn")) {
    document.querySelectorAll("#filters .filter-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentFilter = e.target.dataset.cat;
    render();
  }
});

document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value.toLowerCase().trim();
  render();
});

buildCompanyFilters();
render();
</script>
